name: MN PLAY Branded Windows Launcher

on:
  push:
    branches:
      - mn-play-runtime-build-20260929
    paths:
      - ".github/workflows/mn-play-branded-launcher.yml"

jobs:
  launcher:
    runs-on: windows-latest
    steps:
      - name: Generate standard MN icon and launcher
        shell: pwsh
        run: |
          python -m pip install --quiet pillow
          @'
          from PIL import Image, ImageDraw
          im=Image.new("RGBA",(1024,1024),(5,9,15,255)); d=ImageDraw.Draw(im)
          d.rounded_rectangle((36,36,988,988),radius=220,fill=(2,6,11,255))
          d.polygon([(168,790),(168,248),(310,248),(512,555),(714,248),(856,248),(856,790),(716,790),(716,486),(554,728),(470,728),(308,486),(308,790)],fill=(248,251,255,255))
          d.ellipse((754,114,930,290),fill=(22,139,255,255))
          d.rounded_rectangle((642,604,838,782),radius=54,fill=(8,29,50,255))
          d.polygon([(690,632),(690,754),(794,693)],fill=(22,139,255,255))
          im.save("mnplay.ico",sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          '@ | Set-Content logo_gen.py -Encoding UTF8
          python logo_gen.py

          @'
          #define UNICODE
          #define _UNICODE
          #include <windows.h>
          #include <shellapi.h>
          #include <wchar.h>
          #include <stdlib.h>
          static void q(wchar_t **b,size_t *c,size_t *l,const wchar_t *s){size_t n=wcslen(s)*2+4;if(*l+n+1>*c){*c=(*l+n+1)*2;*b=(wchar_t*)realloc(*b,*c*sizeof(wchar_t));}(*b)[(*l)++]=L'"';for(const wchar_t*p=s;*p;++p){if(*p==L'"')(*b)[(*l)++]=L'\\';(*b)[(*l)++]=*p;}(*b)[(*l)++]=L'"';(*b)[*l]=0;}
          int WINAPI wWinMain(HINSTANCE a,HINSTANCE b,PWSTR c,int d){
            wchar_t e[4096];DWORD n=GetModuleFileNameW(NULL,e,4096);if(!n||n>=4095)return 2;
            wchar_t*s=wcsrchr(e,L'\\');if(!s)return 3;*s=0;
            wchar_t base[4096];wcscpy_s(base,4096,e);
            wchar_t py[4096],sc[4096];swprintf_s(py,4096,L"%ls\\runtime\\pythonw.exe",base);swprintf_s(sc,4096,L"%ls\\app\\run.py",base);
            int ac=0;LPWSTR*av=CommandLineToArgvW(GetCommandLineW(),&ac);size_t cap=8192,len=0;wchar_t*p=(wchar_t*)calloc(cap,sizeof(wchar_t));if(!p)return 4;
            q(&p,&cap,&len,sc);for(int i=1;i<ac;i++){if(len+2>=cap){cap*=2;p=(wchar_t*)realloc(p,cap*sizeof(wchar_t));}p[len++]=L' ';p[len]=0;q(&p,&cap,&len,av[i]);}
            HINSTANCE r=ShellExecuteW(NULL,L"open",py,p,base,SW_SHOWNORMAL);if(av)LocalFree(av);free(p);
            if((INT_PTR)r<=32){MessageBoxW(NULL,L"MN PLAY could not start. The application package may be incomplete.",L"MN PLAY",MB_ICONERROR|MB_OK);return 5;}return 0;
          }
          '@ | Set-Content launcher.c -Encoding ASCII
          '1 ICON "mnplay.ico"' | Set-Content resource.rc -Encoding ASCII

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw "Visual Studio C++ tools not found" }
          $dev = Join-Path $vs "Common7\Tools\VsDevCmd.bat"
          @"
          @echo off
          call "$dev" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b %errorlevel%
          rc.exe /nologo /fo launcher.res resource.rc
          if errorlevel 1 exit /b %errorlevel%
          cl.exe /nologo /O2 /DUNICODE /D_UNICODE launcher.c launcher.res /link /SUBSYSTEM:WINDOWS /OUT:"MN PLAY.exe" shell32.lib user32.lib
          "@ | Set-Content build.cmd -Encoding ASCII
          cmd.exe /d /c build.cmd
          if (!(Test-Path "MN PLAY.exe")) { throw "Launcher not built" }

      - uses: actions/upload-artifact@v4
        with:
          name: mn-play-branded-windows-launcher
          path: "MN PLAY.exe"
          if-no-files-found: error
